<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Game Finder</title><style>:root{font-family:Inter,'Microsoft YaHei',system-ui,sans-serif;color:#f5f5ff;background:#0c1020}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#282453 0%,#0c1020 55%);min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:42px 22px}header{margin-bottom:30px}.eyebrow{color:#a99cff;letter-spacing:3px;font-size:12px;font-weight:700}h1{font-size:clamp(35px,6vw,62px);margin:10px 0}h1 span{color:#a795ff}p{color:#b4b8d2;line-height:1.6}.panel{background:#171b30;border:1px solid #343650;border-radius:22px;padding:25px;box-shadow:0 16px 40px #0004}label{display:block;margin:18px 0 8px;font-size:14px;font-weight:700}input,select,textarea{width:100%;background:#0d1121;border:1px solid #41435f;border-radius:11px;padding:13px;color:white;font:inherit}textarea{min-height:90px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.chips{display:flex;flex-wrap:wrap;gap:9px}.chip{border:1px solid #515474;background:#252942;color:#d8d9ee;padding:9px 14px;border-radius:50px;cursor:pointer}.chip.active{background:#6555d8;border-color:#a99cff;color:white}button.primary{margin-top:22px;width:100%;padding:16px;background:linear-gradient(100deg,#7665ef,#b057e7);border:0;color:white;border-radius:12px;font-size:17px;font-weight:800;cursor:pointer}button:hover{filter:brightness(1.12)}.results{margin-top:32px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{background:#191d34;border:1px solid #343853;border-radius:18px;overflow:hidden}.art{height:115px;display:flex;align-items:center;justify-content:center;font-size:55px;background:linear-gradient(135deg,#353f76,#613f85)}.cardbody{padding:18px}.card h3{margin:0 0 8px}.meta{font-size:12px;color:#ac9dff}.score{float:right;color:#b4f3cd}.reason{font-size:14px;min-height:65px}.card a{color:#bcb1ff;font-size:14px}.notice{font-size:13px;color:#a8acc7;margin-top:15px}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:24px 14px}} </style></head><body><main class="wrap"><header><div class="eyebrow">PERSONALIZED GAME DISCOVERY</div><h1>🎮 AI <span>Game Finder</span></h1><p>选择你喜欢的类型，发现下一款值得玩的游戏。无需安装 Python，直接在浏览器使用。</p></header><section class="panel"><div class="grid"><div><label for="platform">游戏平台</label><select id="platform"><option value="all">不限平台</option><option value="PC">PC / Steam</option><option value="Switch">Nintendo Switch</option><option value="PS5">PlayStation 5</option><option value="PS4">PlayStation 4</option><option value="PSV">PS Vita</option><option value="PSP">PSP</option></select></div><div><label for="language">语言偏好</label><select id="language"><option value="any">不限</option><option value="zh">中文</option><option value="en">英文</option><option value="ja">日文</option></select></div></div><label>喜欢的游戏类型（可多选）</label><div class="chips" id="genres"></div><label for="favorite">你喜欢的游戏（可选）</label><input id="favorite" placeholder="例如：Persona 5、逆转裁判、星露谷物语"><label for="extra">其他偏好（可选）</label><textarea id="extra" placeholder="例如：我喜欢剧情丰富、有多个结局、节奏不太快的游戏"></textarea><button class="primary" id="recommend">✨ 推荐适合我的游戏</button><p class="notice">当前为离线智能匹配演示版：根据标签和偏好对真实游戏进行排序，不会调用生成式 AI。若课程要求必须使用大语言模型，需再接入安全的后端 AI API。</p></section><section id="results" class="results hidden"><h2>✨ 为你推荐</h2><p id="summary"></p><div class="cards" id="cards"></div></section></main><script>
const genres=['RPG','剧情','恋爱','视觉小说','动作','冒险','解谜','恐怖','策略','模拟','开放世界','休闲'];const chosen=new Set();const genresEl=document.getElementById('genres');genres.forEach(g=>{const b=document.createElement('button');b.className='chip';b.textContent=g;b.type='button';b.onclick=()=>{chosen.has(g)?chosen.delete(g):chosen.add(g);b.classList.toggle('active')};genresEl.appendChild(b)});
const games=[
{name:'Persona 5 Royal',emoji:'🎭',tags:['RPG','剧情','策略'],platforms:['PC','Switch','PS5','PS4'],langs:['zh','en','ja'],desc:'校园生活与回合制战斗结合，拥有鲜明角色和长期养成体验。',keys:['persona','女神异闻录','角色','校园']},
{name:'Steins;Gate',emoji:'⏳',tags:['视觉小说','剧情','恋爱'],platforms:['PC','PS4','PSV'],langs:['en','ja'],desc:'以时间旅行和剧情分支为核心的经典视觉小说。',keys:['命运石之门','剧情','时间','分支']},
{name:'Stardew Valley',emoji:'🌾',tags:['模拟','休闲','恋爱'],platforms:['PC','Switch','PS5','PS4','PSV'],langs:['zh','en','ja'],desc:'种田、经营、交朋友，适合喜欢轻松节奏的玩家。',keys:['星露谷','种田','经营','放松']},
{name:'Hades',emoji:'🔥',tags:['动作','RPG','剧情'],platforms:['PC','Switch','PS5','PS4'],langs:['zh','en','ja'],desc:'高速战斗与不断展开的神话故事相结合。',keys:['哈迪斯','战斗','肉鸽']},
{name:'Ace Attorney Trilogy',emoji:'⚖️',tags:['视觉小说','剧情','解谜'],platforms:['PC','Switch','PS4'],langs:['zh','en','ja'],desc:'通过调查、推理和法庭辩论破解案件。',keys:['逆转裁判','推理','侦探','法庭']},
{name:'Doki Doki Literature Club Plus!',emoji:'📖',tags:['视觉小说','剧情','恐怖','恋爱'],platforms:['PC','Switch','PS5','PS4'],langs:['zh','en','ja'],desc:'带有心理恐怖元素的剧情游戏，不适合所有玩家。',keys:['文学部','恐怖','恋爱','反转']},
{name:'The Legend of Zelda: Breath of the Wild',emoji:'🗺️',tags:['动作','冒险','开放世界','解谜'],platforms:['Switch'],langs:['zh','en','ja'],desc:'探索开放世界，利用物理机制解决各种难题。',keys:['塞尔达','探索','开放世界']},
{name:'Hollow Knight',emoji:'🦋',tags:['动作','冒险','开放世界'],platforms:['PC','Switch','PS4'],langs:['zh','en','ja'],desc:'探索地下王国，挑战精密战斗与平台跳跃。',keys:['空洞骑士','探索','挑战']},
{name:'Danganronpa: Trigger Happy Havoc',emoji:'🔍',tags:['视觉小说','剧情','解谜','恐怖'],platforms:['PC','Switch','PSP','PSV'],langs:['en','ja'],desc:'围绕神秘事件展开调查与推理的故事。',keys:['弹丸论破','推理','校园','悬疑']},
{name:'Fire Emblem: Three Houses',emoji:'🏰',tags:['RPG','策略','剧情','恋爱'],platforms:['Switch'],langs:['zh','en','ja'],desc:'战棋策略、角色关系与不同故事路线。',keys:['火焰纹章','战棋','路线']},
{name:'Undertale',emoji:'💛',tags:['RPG','剧情','休闲'],platforms:['PC','Switch','PS4','PSV'],langs:['en','ja'],desc:'选择会影响故事走向的独立角色扮演游戏。',keys:['传说之下','选择','结局']},
{name:'Minecraft',emoji:'⛏️',tags:['开放世界','模拟','冒险','休闲'],platforms:['PC','Switch','PS5','PS4'],langs:['zh','en','ja'],desc:'自由建造、探索与生存，适合发挥创造力。',keys:['我的世界','建造','生存']}
];
function search(){const platform=document.getElementById('platform').value,lang=document.getElementById('language').value,fav=document.getElementById('favorite').value.toLowerCase(),extra=document.getElementById('extra').value.toLowerCase();let filtered=games.filter(g=>(platform==='all'||g.platforms.includes(platform))&&(lang==='any'||g.langs.includes(lang)));const words=(fav+' '+extra).split(/[\s,，。；、]+/).filter(w=>w.length>=2);const ranked=filtered.map(g=>{let score=0;chosen.forEach(t=>{if(g.tags.includes(t))score+=4});for(const w of words){if(g.name.toLowerCase().includes(w)||g.keys.some(k=>k.toLowerCase().includes(w)))score+=5;else if(g.tags.some(t=>w.includes(t.toLowerCase())))score+=2}return {...g,score}}).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));const top=ranked.slice(0,5);document.getElementById('results').classList.remove('hidden');document.getElementById('summary').textContent=top.length?`找到 ${filtered.length} 款符合平台和语言筛选条件的候选游戏，展示最匹配的 ${top.length} 款。`:'没有符合当前筛选条件的游戏，请调整平台或语言。';const cards=document.getElementById('cards');cards.replaceChildren();top.forEach(g=>{const matched=g.tags.filter(t=>chosen.has(t));const card=document.createElement('article');card.className='card';const art=document.createElement('div');art.className='art';art.textContent=g.emoji;const body=document.createElement('div');body.className='cardbody';const h=document.createElement('h3');h.textContent=g.name;const meta=document.createElement('div');meta.className='meta';meta.textContent=g.tags.join(' · ');const reason=document.createElement('p');reason.className='reason';reason.textContent=(matched.length?`符合你喜欢的 ${matched.join('、')} 类型。`:'这是符合你选择的平台与语言条件的候选游戏。')+g.desc;const a=document.createElement('a');a.href='https://www.google.com/search?q='+encodeURIComponent(g.name+' video game');a.target='_blank';a.rel='noopener noreferrer';a.textContent='了解游戏 ↗';body.append(h,meta,reason,a);card.append(art,body);cards.append(card)});document.getElementById('results').scrollIntoView({behavior:'smooth'})}document.getElementById('recommend').addEventListener('click',search);
</script></body></html>
